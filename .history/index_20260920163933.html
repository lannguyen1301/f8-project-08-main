<!DOCTYPE html>
<html lang="en" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grocery Mart</title>

    <!-- favicon -->
    <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <!-- fonts -->
    <link rel="stylesheet" href="./assets/fonts/stylesheet.css">

    <!-- styles -->
    <link rel="stylesheet" href="./assets/css/main.css">

    <!-- script -->
    <script src="./assets/js/script.js"></script>
</head>

<body>

    <!-- header -->
    <header id="header" class="header"></header>
    <script>
        load('#header', './templates/header.html');
    </script>

    <div class="container home">
        <!-- slideshow -->
        <section class="home__container">
            <div class="slideshow">
                <div class="slideshow__inner">
                    <div class="slideshow__item">
                        <a href="#!" class="slideshow__link">
                            <picture>
                                <source media="(max-width: 767.98px)" srcset="./assets/img/slideshow/item-1-md.png" />
                                <img src="./assets/img/slideshow/item-1.png" alt="" loading="lazy"
                                    class="slideshow__img">
                            </picture>
                        </a>
                    </div>


                </div>
                <div class="slideshow__page">
                    <span class="slideshow__num">1</span>
                    <span class="slideshow__slider"></span>
                    <span class="slideshow__num">5</span>
                </div>
            </div>
        </section>

        <!-- Browse Categories -->
        <section class="home__container">
            <h2 class="home__heading">
                Browse Categories
            </h2>
            <div class="row row-cols-3 row-cols-md-1">
                <!-- Category item 1 -->
                <div class="col">
                    <article class="cate-item">
                        <img src="../assets/img/category-item/i" alt="" class="cate-item__thumb">
                        <section class="cate-item__info">
                            <h3 class="cate-item__title">$24 - $150</h3>
                            <p class="cate-item__desc">New sumatra mandeling coffe blend</p>
                        </section>
                    </article>
                </div>
            </div>
        </section>
        <!-- Browse Products-->
        <section class="home__container">

        </section>

        <!-- Footer -->
        <footer id="footer"></footer>
        <script>
            load('#footer', './templates/footer.html');
        </script>
    </div>

    <!-- Browse Categories -->
</body>

</html>
